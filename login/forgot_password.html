<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost &amp; Found | Password Recovery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Campus Lost &amp; Found</h1>
        <p>Recover your account password</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h2>Password Recovery</h2>
            <p>Enter your institutional email to request a password reset token.</p>

            <form id="recovery-form" action="#" method="post">
                <p>
                    <label for="recovery-email">Institutional Email</label>
                    <input type="email" id="recovery-email" name="email"
                           placeholder="Enter your institutional email" required>
                </p>

                <button type="button" id="request-token-button">Request Reset Token</button>

                <hr>

                <h3>Verify Token and Reset Password</h3>

                <p>
                    <label for="security-token">Security Token</label>
                    <input type="text" id="security-token" name="security_token"
                           placeholder="Enter the token sent to your email" required>
                </p>

                <p>
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" name="new_password"
                           placeholder="Enter your new password" minlength="6" required>
                </p>

                <p>
                    <label for="confirm-new-password">Confirm New Password</label>
                    <input type="password" id="confirm-new-password" name="confirm_new_password"
                           placeholder="Enter your new password again" minlength="6" required>
                </p>

                <button type="submit">Reset Password</button>
            </form>

            <p><a href="login.html">Return to Login</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Campus Lost &amp; Found</p>
    </footer>
</body>
</html>
