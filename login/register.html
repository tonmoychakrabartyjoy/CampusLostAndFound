<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost &amp; Found | Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Campus Lost &amp; Found</h1>
        <p>Create a new account</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h2>Account Registration</h2>
            <p>Fill in the form to create your account.</p>

            <form id="register-form" action="#" method="post">
                <p>
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="full_name"
                           placeholder="Enter your full name" required>
                </p>

                <p>
                    <label for="user-id">Student / Employee ID</label>
                    <input type="text" id="user-id" name="user_id"
                           placeholder="Enter your student or employee ID" required>
                </p>

                <p>
                    <label for="institutional-email">Institutional Email</label>
                    <input type="email" id="institutional-email" name="email"
                           placeholder="Enter your institutional email" required>
                </p>

                <p>
                    <label for="register-role">Select your role</label>
                    <select id="register-role" name="role" required>
                        <option value="">Choose your role</option>
                        <option value="student">Student</option>
                        <option value="staff">Staff</option>
                        <option value="security">Security Officer</option>
                        <option value="admin">Administrator</option>
                    </select>
                </p>

                <p>
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" name="password"
                           placeholder="Create a password" minlength="6" required>
                </p>

                <p>
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm_password"
                           placeholder="Enter your password again" minlength="6" required>
                </p>

                <button type="submit">Create Account</button>
                <button type="reset" class="reset-button">Clear Form</button>
            </form>

            <p>Already have an account? <a href="login.html">Login here</a>.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Campus Lost &amp; Found</p>
    </footer>
</body>
</html>
