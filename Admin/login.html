<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost &amp; Found | Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Campus Lost &amp; Found</h1>
        <p>Login to your account</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h2>Login</h2>
            <p>Enter your account information to continue.</p>

            <form id="login-form" action="#" method="post">
                <p>
                    <label for="login-id">Username / Student or Employee ID</label>
                    <input type="text" id="login-id" name="login_id"
                           placeholder="Enter your username or ID" required>
                </p>

                <p>
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password"
                           placeholder="Enter your password" required>
                </p>

                <p>
                    <label for="login-role">Select your role</label>
                    <select id="login-role" name="role" required>
                        <option value="">Choose your role</option>
                        <option value="student">Student</option>
                        <option value="staff">Staff</option>
                        <option value="security">Security Officer</option>
                        <option value="admin">Administrator</option>
                    </select>
                </p>

                <button type="submit">Login</button>
                <p id="login-message" class="error-message" role="alert"></p>
            </form>

            <p><a href="forgot_password.html">Forgot Password?</a></p>
            <p>Do not have an account? <a href="register.html">Register here</a>.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Campus Lost &amp; Found</p>
    </footer>
</body>
</html>
